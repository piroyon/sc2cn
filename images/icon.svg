<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Sci2Common icon: an Iberian ribbed newt (Pleurodeles waltl), top-down.
       The orange dots are the rib tips it is named for.
       icon48 uses this as is; icon128 puts it inside a 16px transparent
       margin, as the Chrome Web Store asks. icon16 uses icon-small.svg. -->
  <rect width="128" height="128" rx="28" fill="#2f6b4f"/>
  <g transform="translate(64 64) rotate(-30) scale(1.08) translate(-10 -6)">
    <!-- tail, curled so the whole newt fits a square -->
    <path d="M-7 15 C -9 34, -1 50, 17 56 C 31 60, 43 53, 46 42 C 38 50, 25 50, 16 44 C 8 38, 6 28, 7 15 Z" fill="#fff"/>
    <!-- legs -->
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-8 -15 L-20 -19 L-24 -27"/>
      <path d="M8 -15 L20 -19 L24 -27"/>
      <path d="M-8 12 L-20 17 L-23 26"/>
      <path d="M8 12 L20 17 L23 26"/>
    </g>
    <!-- body and head -->
    <ellipse cx="0" cy="-1" rx="11" ry="22" fill="#fff"/>
    <path d="M-12 -26 C -12 -38, -6 -44, 0 -44 C 6 -44, 12 -38, 12 -26 C 12 -20, 7 -17, 0 -17 C -7 -17, -12 -20, -12 -26 Z" fill="#fff"/>
    <!-- eyes -->
    <circle cx="-6" cy="-32" r="2.4" fill="#2f6b4f"/>
    <circle cx="6" cy="-32" r="2.4" fill="#2f6b4f"/>
    <!-- rib tips -->
    <g fill="#f2a33a">
      <circle cx="-11" cy="-8" r="3.6"/><circle cx="-11.6" cy="0" r="3.6"/><circle cx="-11" cy="8" r="3.6"/>
      <circle cx="11" cy="-8" r="3.6"/><circle cx="11.6" cy="0" r="3.6"/><circle cx="11" cy="8" r="3.6"/>
    </g>
  </g>
</svg>
